version: '3.8'

services:
  # FastAPI Backend
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - OPENROUTESERVICE_API_KEY=${OPENROUTESERVICE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - redis
    networks:
      - freight-network

  # Streamlit Frontend
  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=development
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - freight-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - freight-network

  # Celery for background tasks (optional)
  celery:
    build: .
    command: celery -A backend.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - ENVIRONMENT=development
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - freight-network

  # Celery Beat for scheduled tasks (optional)
  celery-beat:
    build: .
    command: celery -A backend.celery_app beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - ENVIRONMENT=development
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - freight-network

volumes:
  redis_data:

networks:
  freight-network:
    driver: bridge